<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語並べ替え学習アプリ</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .game-container { background-color: white; border: 3px solid #333; padding: 25px; width: 100%; max-width: 650px; box-sizing: border-box; border-radius: 10px; }
        .display-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .display-table td { border: 2px solid #333; padding: 15px; font-size: 22px; text-align: left; font-weight: bold; line-height: 1.4; }
        .answer-row { background-color: #fff; min-height: 60px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #333; margin-bottom: 20px; padding: 5px 10px; }
        .user-ans-text { font-size: 24px; font-family: monospace; font-weight: bold; color: #1a0dab; min-height: 28px; }
        .show-ans-btn { background-color: #e1e1e1; border: 2px solid #333; padding: 8px 15px; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 5px; }
        .choices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .choice-btn { border: 2px solid #333; background-color: #fff; padding: 15px; font-size: 22px; font-weight: bold; cursor: pointer; text-align: center; min-height: 65px; display: flex; align-items: center; justify-content: center; border-radius: 8px; box-shadow: 0 3px 0 #333; }
        .choice-btn:active { transform: translateY(3px); box-shadow: none; }
        .choice-btn:disabled { background-color: #e1e1e1; color: #999; cursor: default; box-shadow: none; transform: translateY(3px); }
        .control-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .ctrl-btn { border: 2px solid #333; background-color: #fff; padding: 12px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .ctrl-btn:hover { background-color: #e1e1e1; }
        .sound-message { font-size: 24px; font-weight: bold; margin: 15px 0; min-height: 35px; text-align: center; }
        .correct-sound { color: #2f855a; }
        .incorrect-sound { color: #c53030; }
        #setupArea { margin-top: 20px; border-top: 3px dashed #999; padding-top: 20px; text-align: left; }
        textarea { width: 100%; height: 130px; padding: 10px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; border: 2px solid #333; }
        .start-action-btn { background-color: #333; color: white; border: none; padding: 15px; width: 100%; font-size: 18px; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .exception-check { font-size: 16px; margin-bottom: 15px; text-align: left; display: flex; align-items: center; gap: 8px; font-weight: bold; }
    </style>
</head>
<body>
<div class="game-container">
    <table class="display-table"><tr><td id="japaneseText">※まず一番下の入力枠に10問のデータを貼り付けて、黒いボタンを押してください。</td></tr></table>
    <div class="answer-row"><div id="userAnswer" class="user-ans-text"></div><button class="show-ans-btn" onclick="showCorrectAnswer()">【正解文】</button></div>
    <div id="soundOutput" class="sound-message"></div>
    <div class="choices-grid">
        <button id="c0" class="choice-btn" onclick="pressWord(0)" disabled></button><button id="c1" class="choice-btn" onclick="pressWord(1)" disabled></button><button id="c2" class="choice-btn" onclick="pressWord(2)" disabled></button>
        <button id="c3" class="choice-btn" onclick="pressWord(3)" disabled></button><button id="c4" class="choice-btn" onclick="pressWord(4)" disabled></button><button id="c5" class="choice-btn" onclick="pressWord(5)" disabled></button>
        <button id="c6" class="choice-btn" onclick="pressWord(6)" disabled></button><button id="c7" class="choice-btn" onclick="pressWord(7)" disabled></button><button id="c8" class="choice-btn" onclick="pressWord(8)" disabled></button>
    </div>
    <div class="control-row">
        <button class="ctrl-btn" onclick="window.close()">Close</button><button class="ctrl-btn" onclick="focusInput()">Open</button><button class="ctrl-btn" onclick="clearCurrentTry()">Clear</button><button id="startNextBtn" class="ctrl-btn" onclick="pressStartNext()">Start</button>
    </div>
    <div class="exception-check"><input type="checkbox" id="noCapitalCheck" style="transform: scale(1.3);"><label for="noCapitalCheck">文頭を大文字にしない（例外用）</label></div>
    <div id="setupArea">
        <p style="margin: 0 0 8px 0; font-size: 16px; font-weight: bold; color: #333;">【問題データ入力窓】ここにファイルを貼り付けます：</p>
        <textarea id="fileDataInput" placeholder="お持ちのテキストファイル（10問分）をここに丸ごと貼り付けてください"></textarea>
        <button class="start-action-btn" onclick="loadTextData()">データをアプリに読み込む（OK）</button>
    </div>
</div>
<script>
    let questions = []; let currentIdx = 0; let selectedWords = []; let currentChoices = []; let isAnswered = false;
    function parseTextData(text) {
        const lines = text.split(/[\r\n]+/).map(l => l.trim()).filter(l => l.length > 0); const parsed = [];
        for (let i = 0; i < lines.length; i++) {
            const curLine = lines[i];
            if (/[ぁ-んァ-ン一-龠々]/.test(curLine)) {
                if (curLine.includes("File:") || curLine.includes("完了") || curLine.includes("継続") || curLine.includes("Sent")) continue;
                const hint = curLine;
                if (i + 1 < lines.length) {
                    const answer = lines[i + 1]; const choices = []; let j = i + 2;
                    while (j < lines.length && !/[ぁ-んァ-ン一-龠々]/.test(lines[j])) {
                        if (!lines[j].includes("File:") && !lines[j].includes("Sent")) {
                            if (lines[j].includes("/")) { lines[j].split("/").map(w => w.trim()).filter(w => w.length > 0).forEach(w => choices.push(w)); } 
                            else { choices.push(lines[j]); }
                        }
                        j++;
                    }
                    if (hint && answer && choices.length > 0) { parsed.push({ hint: hint, answer: answer, choices: choices }); }
                    i = j - 1;
                }
            }
        }
        return parsed;
    }
    function focusInput() { document.getElementById("fileDataInput").focus(); }
    function loadTextData() {
        const input = document.getElementById("fileDataInput").value; questions = parseTextData(input);
        if (questions.length === 0) { alert("データの読み込みに失敗しました。形式を確認してください。"); return; }
        document.getElementById("startNextBtn").textContent = "Start"; currentIdx = 0; initGame();
    }
    function pressStartNext() {
        const btn = document.getElementById("startNextBtn");
        if (btn.textContent === "Start") {
            if (questions.length === 0) { alert("まずデータを入力枠に貼り付けて、黒いボタンを押してください。"); return; }
            initGame();
        } else {
            currentIdx++;
            if (currentIdx >= questions.length) {
                alert("全問クリアしました！次のファイルを下の枠に貼り付けてください。");
                document.getElementById("startNextBtn").textContent = "Start";
                document.getElementById("japaneseText").textContent = "全問クリアしました。次のファイルを下に貼り付けてください。";
                document.getElementById("fileDataInput").value = ""; clearBoard();
            } else { initGame(); }
        }
    }
    function clearBoard() {
        document.getElementById("userAnswer").textContent = ""; document.getElementById("soundOutput").textContent = "";
        for (let i = 0; i < 9; i++) { const btn = document.getElementById(`c${i}`); btn.textContent = ""; btn.disabled = true; }
    }
    function initGame() {
        if (questions.length === 0) return; const q = questions[currentIdx];
        document.getElementById("japaneseText").textContent = q.hint; document.getElementById("userAnswer").textContent = "";
        document.getElementById("soundOutput").textContent = ""; document.getElementById("soundOutput").className = "sound-message";
        document.getElementById("startNextBtn").textContent = "Start"; selectedWords = []; isAnswered = false;
        currentChoices = q.choices.map(w => w.toLowerCase()); while (currentChoices.length < 9) { currentChoices.push(""); }
        renderChoices();
    }
    function renderChoices() {
        for (let i = 0; i < 9; i++) {
            const btn = document.getElementById(`c${i}`); const word = currentChoices[i]; btn.textContent = word;
            if (word === "") { btn.disabled = true; } else { btn.disabled = selectedWords.some(s => s.idx === i); }
        }
    }
    function pressWord(idx) {
        if (isAnswered) return; let word = currentChoices[idx];
        const noCapital = document.getElementById("noCapitalCheck").checked;
        if (selectedWords.length === 0 && !noCapital) { word = word.charAt(0).toUpperCase() + word.slice(1); }
        selectedWords.push({ word: word, idx: idx }); document.getElementById(`c${idx}`).disabled = true;
        updateAnswerDisplay();
        if (word === "." || word === "?" || word.endsWith(".") || word.endsWith("?")) { checkAnswer(); }
    }
    function updateAnswerDisplay() {
        let sentence = "";
        selectedWords.forEach((item, i) => {
            if (i === 0) { sentence += item.word; } 
            else if (item.word === "." || item.word === "?") { sentence += item.word; } 
            else { sentence += " " + item.word; }
        });
        document.getElementById("userAnswer").textContent = sentence;
    }
    function clearCurrentTry() { if (questions.length === 0) return; initGame(); }
    function showCorrectAnswer() {
        if (questions.length === 0) return; const q = questions[currentIdx];
